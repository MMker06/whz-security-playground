<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>쇼핑몰 회원가입</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #e0f7fa, #fff3e0);
    }
    .register-box {
      max-width: 550px;
      margin: 50px auto;
      padding: 40px;
      border-radius: 12px;
      background-color: white;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }
    .form-label {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="register-box">
    <h2 class="text-center mb-4">회원가입</h2>
    <form action="register_result.php" method="POST">
      <div class="mb-3">
        <label for="realname" class="form-label">이름</label>
        <input type="text" class="form-control" id="realname" name="realname" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">이메일</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <div class="mb-3">
        <label for="address" class="form-label">주소</label>
        <textarea class="form-control" id="address" name="address" rows="2"></textarea>
      </div>
      <div class="mb-3">
        <label for="username" class="form-label">아이디</label>
        <input type="text" class="form-control" id="username" name="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">비밀번호</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">가입하기</button>
    </form>
    <p class="text-center mt-3">
      이미 계정이 있으신가요? <a href="login.html">로그인하기</a>
    </p>
  </div>
</body>
</html>
